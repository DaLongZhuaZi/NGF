name: Build CI image

# 一次性构建 HarmonyOS API 26 CI 镜像并推送 ghcr.io。
# 产物: ghcr.io/<owner>/harmonyos-ci:<tag>(默认 tag: api26), 被 build.yml /
# sign-and-release.yml 引用, 保证构建环境随镜像锁定、可复现。
#
# 前置: 华为官方 command-line-tools Linux x64 zip 的可下载直链。
#   官方下载页: https://developer.huawei.com/consumer/cn/doc/harmonyos-guides/ide-commandline-get
#   (链接带时效签名, 请先下载到本地, 再上传到 GitHub Release 附件/对象存储等可直链处)

on:
  workflow_dispatch:
    inputs:
      clt_zip_url:
        description: 'command-line-tools-linux-x64-*.zip 下载直链(留空则用 secrets.CLT_ZIP_URL)'
        required: false
        default: ''
      image_tag:
        description: '镜像 tag(如 api26 或精确版本号 6.x.y.z)'
        required: true
        default: 'api26'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & push harmonyos-ci image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve command-line-tools zip URL
        id: url
        env:
          INPUT_URL: ${{ inputs.clt_zip_url }}
          SECRET_URL: ${{ secrets.CLT_ZIP_URL }}
        run: |
          url="$INPUT_URL"
          if [ -z "$url" ]; then
            url="$SECRET_URL"
          fi
          if [ -z "$url" ]; then
            echo "::error::需要 inputs.clt_zip_url 或仓库 secret CLT_ZIP_URL(command-line-tools linux x64 zip 直链)"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Resolve lowercase image name
        id: img
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ inputs.image_tag }}
        run: |
          owner=$(printf '%s' "$OWNER" | tr 'A-Z' 'a-z')
          echo "image=ghcr.io/${owner}/harmonyos-ci:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: docker/harmonyos-ci.Dockerfile
          push: true
          build-args: |
            CLT_ZIP_URL=${{ steps.url.outputs.url }}
          tags: ${{ steps.img.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
