<style>
:root { color-scheme: light dark; --page-bg: #eef3f8; --text: #111827; --muted: #4b5563; --qr-card-bg: #ffffff; --qr-card-border: #d8e0ea; --qr-card-shadow: rgba(15, 23, 42, 0.16); --warning-bg: #fff7ed; --warning-text: #9a3412; --warning-border: #fed7aa; --field-bg: rgba(255, 255, 255, 0.78); --field-border: #d8e0ea; --field-label: #64748b; --field-value: #0f172a; }
@media (prefers-color-scheme: dark) { :root { --page-bg: #0f172a; --text: #f8fafc; --muted: #cbd5e1; --qr-card-bg: #ffffff; --qr-card-border: rgba(148, 163, 184, 0.32); --qr-card-shadow: rgba(0, 0, 0, 0.42); --warning-bg: rgba(251, 191, 36, 0.14); --warning-text: #facc15; --warning-border: rgba(251, 191, 36, 0.32); --field-bg: rgba(15, 23, 42, 0.72); --field-border: rgba(148, 163, 184, 0.28); --field-label: #94a3b8; --field-value: #e2e8f0; } }
body { margin: 0; min-height: 100vh; font-family: "Segoe UI", Arial, sans-serif; background: var(--page-bg); color: var(--text); }
main { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px; box-sizing: border-box; }
.panel { width: min(960px, 100%); display: grid; grid-template-columns: minmax(320px, 1fr) minmax(260px, 340px); gap: 28px; align-items: center; }
.qr-card { display: flex; justify-content: center; box-sizing: border-box; width: 100%; overflow: hidden; padding: 32px; background: var(--qr-card-bg); border: 1px solid var(--qr-card-border); border-radius: 24px; box-shadow: 0 24px 80px var(--qr-card-shadow); }
.qr-card img { display: block; width: min(100%, 640px, 720px); height: auto; aspect-ratio: 1 / 1; image-rendering: pixelated; image-rendering: crisp-edges; }
.copy { display: flex; flex-direction: column; gap: 18px; }
h1 { margin: 0; font-size: 30px; line-height: 1.15; font-weight: 650; }
p { margin: 0; color: var(--muted); line-height: 1.55; font-size: 15px; }
.warning { padding: 12px 14px; border-radius: 14px; background: var(--warning-bg); color: var(--warning-text); border: 1px solid var(--warning-border); }
.fields { display: flex; flex-direction: column; gap: 10px; }
.field { padding: 12px 14px; border: 1px solid var(--field-border); border-radius: 14px; background: var(--field-bg); }
.field-label { font-size: 12px; color: var(--field-label); margin-bottom: 4px; }
.field-value { font-size: 13px; color: var(--field-value); word-break: break-all; font-family: Consolas, "SFMono-Regular", monospace; }
@media (max-width: 780px) { main { padding: 18px; } .panel { grid-template-columns: minmax(0, 1fr); } .qr-card { padding: 22px; } h1 { font-size: 24px; } }
</style>
